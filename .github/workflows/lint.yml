name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check style
        run: ruff format --check custom_components/

      - name: Lint
        run: ruff check custom_components/
